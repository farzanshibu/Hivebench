name: Build release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner ships the Android SDK; accept licenses and add what the build needs.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          HB_KEYSTORE_BASE64: ${{ secrets.HB_KEYSTORE_BASE64 }}
        run: |
          test -n "$HB_KEYSTORE_BASE64" || { echo "::error::HB_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$HB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hivebench-release.jks"
          echo "HB_UPLOAD_STORE_FILE=$RUNNER_TEMP/hivebench-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          HB_UPLOAD_STORE_PASSWORD: ${{ secrets.HB_UPLOAD_STORE_PASSWORD }}
          HB_UPLOAD_KEY_ALIAS: ${{ secrets.HB_UPLOAD_KEY_ALIAS }}
          HB_UPLOAD_KEY_PASSWORD: ${{ secrets.HB_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION_ARGS=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # v1.2.3 -> versionName 1.2.3, versionCode 10203
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION_NAME%%-*}"
            VERSION_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
            VERSION_ARGS="-PappVersionName=$VERSION_NAME -PappVersionCode=$VERSION_CODE"
            echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
            echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          fi
          ./gradlew :app:assembleOnlineRelease --no-daemon $VERSION_ARGS
          mkdir -p dist
          cp "$(ls -t app/build/outputs/apk/online/release/*.apk | head -1)" "dist/Hivebench-${GITHUB_REF_NAME//\//-}.apk"

      - name: Write update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APK="dist/Hivebench-${GITHUB_REF_NAME}.apk"
          # Shown in the in-app update dialog: commit subjects since the previous tag.
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          NOTES="$(git log --no-merges --format='- %s' ${PREVIOUS_TAG:+"$PREVIOUS_TAG.."}"$GITHUB_REF_NAME" | head -20)"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$APK")" \
            --arg sha256 "$(sha256sum "$APK" | cut -d' ' -f1)" \
            --argjson sizeBytes "$(stat -c %s "$APK")" \
            --arg notes "${NOTES:-Hivebench ${VERSION_NAME}}" \
            '{versionCode: $versionCode, versionName: $versionName, notes: $notes,
              artifacts: {online: {url: $url, sha256: $sha256, sizeBytes: $sizeBytes}}}' \
            > dist/hivebench-update.json
          cat dist/hivebench-update.json

      - uses: actions/upload-artifact@v4
        with:
          name: Hivebench-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/hivebench-update.json
          generate_release_notes: true

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hivebench-release.jks"
